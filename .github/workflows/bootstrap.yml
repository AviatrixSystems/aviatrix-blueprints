name: Bootstrap State Bucket

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region for the state bucket"
        required: true
        default: "us-east-2"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Create S3 State Bucket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: .github/bootstrap
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: .github/bootstrap
        run: |
          terraform apply -auto-approve -input=false \
            -var="aws_region=${{ inputs.aws_region }}"

      - name: Get bucket name
        id: output
        working-directory: .github/bootstrap
        run: |
          BUCKET=$(terraform output -raw bucket_name)
          echo "bucket_name=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "## Bootstrap Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**State Bucket:** \`$BUCKET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set this as a GitHub variable:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "gh variable set TF_STATE_BUCKET --body \"$BUCKET\"" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set TF_STATE_BUCKET variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set TF_STATE_BUCKET --body "${{ steps.output.outputs.bucket_name }}"
          echo "::notice::TF_STATE_BUCKET set to ${{ steps.output.outputs.bucket_name }}"

      - name: Upload state backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-tfstate
          path: .github/bootstrap/terraform.tfstate
          retention-days: 90
