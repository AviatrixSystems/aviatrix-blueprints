<svg width="980" height="380" viewBox="0 0 980 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Aviatrix spoke gateway egress control — dark theme (VM only)</title>
<defs>
  <style>
    @keyframes dash-neutral { to { stroke-dashoffset: -24; } }
    @keyframes dash-red     { to { stroke-dashoffset: -24; } }
    @keyframes dash-green   { to { stroke-dashoffset: -24; } }
    @keyframes block-pop    { 0%{opacity:0;transform:scale(0.4)} 60%{opacity:1;transform:scale(1.15)} 100%{opacity:1;transform:scale(1)} }
    @keyframes fade-in      { from{opacity:0} to{opacity:1} }
    @keyframes pulse-threat { 0%,100%{opacity:0.55} 50%{opacity:1} }
    @media (prefers-reduced-motion: no-preference) {
      .flow-neutral { stroke-dasharray:8 5; animation:dash-neutral 1s linear infinite; }
      .flow-pull    { stroke-dasharray:8 5; animation:dash-neutral 1.2s linear infinite; }
      .flow-red     { stroke-dasharray:8 5; animation:dash-red 0.9s linear infinite; animation-delay:0.6s; }
      .flow-green   { stroke-dasharray:8 5; animation:dash-green 0.9s linear infinite; animation-delay:1.1s; }
      .block-group  { animation:block-pop 0.5s cubic-bezier(.22,.68,0,1.2) forwards; animation-delay:1.4s; opacity:0; }
      .allowed-label{ animation:fade-in 0.4s ease forwards; animation-delay:1.8s; opacity:0; }
      .threat-layer { animation:pulse-threat 2s ease-in-out infinite; }
    }
  </style>
  <marker id="arr-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-pull" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#AFA9EC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect x="0" y="0" width="980" height="380" fill="#0e0e0e"/>

<!-- GitHub repo -->
<rect x="14" y="90" width="144" height="200" rx="6" fill="none" stroke="#7F77DD" stroke-width="1.5"/>
<text x="86" y="114" text-anchor="middle" fill="#AFA9EC" font-size="13" font-family="sans-serif" font-weight="600">GitHub repo</text>
<text x="86" y="132" text-anchor="middle" fill="#7F77DD" font-size="11" font-family="sans-serif">workflow source</text>
<rect x="30" y="146" width="112" height="10" rx="2" fill="none" stroke="#534AB7" stroke-width="0.8"/>
<rect x="30" y="162" width="82"  height="10" rx="2" fill="none" stroke="#534AB7" stroke-width="0.8"/>
<rect x="30" y="178" width="96"  height="10" rx="2" fill="none" stroke="#534AB7" stroke-width="0.8"/>
<rect x="30" y="194" width="70"  height="10" rx="2" fill="none" stroke="#534AB7" stroke-width="0.8"/>
<rect x="30" y="210" width="90"  height="10" rx="2" fill="none" stroke="#534AB7" stroke-width="0.8"/>
<text x="86" y="245" text-anchor="middle" fill="#7F77DD" font-size="11" font-family="sans-serif">.github/workflows</text>
<text x="86" y="263" text-anchor="middle" fill="#534AB7" font-size="11" font-family="sans-serif">ci.yml</text>
<text x="86" y="280" text-anchor="middle" fill="#534AB7" font-size="11" font-family="sans-serif">package.json</text>

<!-- Workload subnet -->
<rect x="172" y="70" width="282" height="240" rx="4" fill="none" stroke="#444441" stroke-width="1" stroke-dasharray="6 3"/>
<text x="184" y="88" fill="#5F5E5A" font-size="11" font-family="sans-serif">Workload subnet  10.0.1.0/24</text>

<!-- Azure / AWS VM -->
<rect x="188" y="90" width="250" height="200" rx="6" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text x="313" y="114" text-anchor="middle" fill="#5DCAA5" font-size="13" font-family="sans-serif" font-weight="600">Azure / AWS VM</text>
<text x="313" y="134" text-anchor="middle" fill="#1D9E75" font-size="11" font-family="sans-serif">GitHub Actions runner</text>
<rect x="212" y="146" width="202" height="24" rx="3" fill="none" stroke="#0F6E56" stroke-width="0.8"/>
<text x="313" y="162" text-anchor="middle" fill="#1D9E75" font-size="11" font-family="sans-serif">self-hosted runner</text>
<rect x="212" y="174" width="202" height="24" rx="3" fill="none" stroke="#0F6E56" stroke-width="0.8"/>
<text x="313" y="190" text-anchor="middle" fill="#1D9E75" font-size="11" font-family="sans-serif">job: ci workflow</text>
<rect x="212" y="202" width="202" height="24" rx="3" fill="none" stroke="#0F6E56" stroke-width="0.8"/>
<text x="313" y="218" text-anchor="middle" fill="#1D9E75" font-size="11" font-family="sans-serif">image: ubuntu:22.04</text>
<rect class="threat-layer" x="212" y="230" width="202" height="24" rx="3" fill="none" stroke="#E24B4A" stroke-width="1.2"/>
<text x="313" y="246" text-anchor="middle" fill="#F09595" font-size="11" font-family="sans-serif">compromised dep (transitive)</text>

<!-- Gateway subnet -->
<rect x="468" y="70" width="202" height="240" rx="4" fill="none" stroke="#444441" stroke-width="1" stroke-dasharray="6 3"/>
<text x="480" y="88" fill="#5F5E5A" font-size="11" font-family="sans-serif">Gateway subnet  10.0.0.0/24</text>

<!-- Aviatrix GW -->
<rect x="484" y="120" width="170" height="140" rx="6" fill="none" stroke="#378ADD" stroke-width="1.5"/>
<text x="569" y="148" text-anchor="middle" fill="#85B7EB" font-size="13" font-family="sans-serif" font-weight="600">Aviatrix spoke GW</text>
<text x="569" y="170" text-anchor="middle" fill="#378ADD" font-size="11" font-family="sans-serif">FQDN enforcement</text>
<text x="569" y="190" text-anchor="middle" fill="#378ADD" font-size="11" font-family="sans-serif">Egress inspection</text>
<text x="569" y="210" text-anchor="middle" fill="#378ADD" font-size="11" font-family="sans-serif">Threat intel</text>

<!-- Egress targets -->
<rect x="700" y="68" width="200" height="48" rx="4" fill="none" stroke="#E24B4A" stroke-width="1"/>
<text x="800" y="90" text-anchor="middle" fill="#F09595" font-size="13" font-family="sans-serif" font-weight="600">webhook.site</text>
<text x="800" y="108" text-anchor="middle" fill="#A32D2D" font-size="11" font-family="sans-serif">exfiltration target</text>

<rect x="700" y="264" width="200" height="48" rx="4" fill="none" stroke="#3B6D11" stroke-width="1"/>
<text x="800" y="286" text-anchor="middle" fill="#97C459" font-size="13" font-family="sans-serif" font-weight="600">www.example.com</text>
<text x="800" y="304" text-anchor="middle" fill="#3B6D11" font-size="11" font-family="sans-serif">valid FQDN</text>

<!-- Legend -->
<rect x="700" y="330" width="240" height="40" rx="4" fill="none" stroke="#444441" stroke-width="0.8"/>
<line x1="716" y1="344" x2="746" y2="344" stroke="#AFA9EC" stroke-width="1.2" stroke-dasharray="8 5" marker-end="url(#arr-pull)"/>
<text x="754" y="348" fill="#888780" font-size="11" font-family="sans-serif">Workflow pull</text>
<line x1="716" y1="362" x2="746" y2="362" stroke="#888780" stroke-width="1.5" stroke-dasharray="8 5" marker-end="url(#arr-n)"/>
<text x="754" y="366" fill="#888780" font-size="11" font-family="sans-serif">Runner → spoke</text>

<!-- Pull flow: GitHub → VM -->
<path class="flow-pull" d="M158 190 L188 190" fill="none" stroke="#AFA9EC" stroke-width="1.2" marker-end="url(#arr-pull)"/>

<!-- Runner → GW -->
<path class="flow-neutral" d="M438 190 L484 190" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arr-n)"/>

<!-- Red: GW → blocked at webhook.site -->
<path class="flow-red" d="M654 160 L686 110" fill="none" stroke="#E24B4A" stroke-width="1.8"/>
<g class="block-group" style="transform-origin:690px 100px;">
  <circle cx="690" cy="100" r="14" fill="none" stroke="#E24B4A" stroke-width="2"/>
  <line x1="683" y1="93" x2="697" y2="107" stroke="#E24B4A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="697" y1="93" x2="683" y2="107" stroke="#E24B4A" stroke-width="2.2" stroke-linecap="round"/>
</g>

<!-- Green: GW → www.example.com -->
<path class="flow-green" d="M654 220 L700 288" fill="none" stroke="#639922" stroke-width="1.8" marker-end="url(#arr-g)"/>
<g class="allowed-label">
  <circle cx="677" cy="254" r="14" fill="none" stroke="#639922" stroke-width="2"/>
  <polyline points="670,254 675,261 685,247" fill="none" stroke="#639922" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>

</svg>