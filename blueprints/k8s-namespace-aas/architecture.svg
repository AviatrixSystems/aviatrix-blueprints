      <rect x="100" y="400" width="700" height="80" rx="10" fill="white" stroke="#0066CC" stroke-width="1.5"/>
      <text x="450" y="422" text-anchor="middle" fill="#001A3A" font-size="12" font-weight="700">DCF SmartGroups — Namespace + Label Based (type: k8s)</text>
      <text x="130" y="448" fill="#4A5568" font-size="11">sg-team-a: k8s_namespace = "team-a"</text>
      <text x="400" y="448" fill="#4A5568" font-size="11">sg-team-b: k8s_namespace = "team-b"</text>
