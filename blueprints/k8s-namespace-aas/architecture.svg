      <rect x="345" y="165" width="195" height="80" rx="8" fill="#F0FFF4" stroke="#00C48C" stroke-width="1.5"/>
      <text x="442" y="185" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">ns: team-b</text>
