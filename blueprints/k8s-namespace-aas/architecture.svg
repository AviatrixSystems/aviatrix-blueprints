      <text x="440" y="330" text-anchor="middle" fill="#92400E" font-size="10" font-weight="600">Platform DCF Baseline: namespace isolation | approved egress WebGroups</text>
      <line x1="760" y1="110" x2="520" y2="70" stroke="#0066CC" stroke-width="2" stroke-dasharray="4,4"/>
