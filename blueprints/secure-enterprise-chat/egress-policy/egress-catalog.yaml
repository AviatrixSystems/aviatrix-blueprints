# Static egress domain catalog for the LibreChat API pod.
# Pure data: generate.py reads this; never edit generated output instead of this file.

# The LibreChat pod has NO unconditional egress. Container image pulls happen on
# the node (kubelet), not from the pod, so a pod-scoped policy never sees them --
# they are intentionally NOT listed here.

bedrock:
  # STS is needed only when Bedrock is in use, for the IRSA
  # AssumeRoleWithWebIdentity token exchange. Emitted alongside
  # bedrock-runtime.<region> when Bedrock is enabled.
  sts_domains:
    - "sts.amazonaws.com"

env_gated:
  RAG_OPENAI_API_KEY:
    domains: ["api.openai.com"]
  FLUX_API_BASE_URL:
    domains: ["api.us1.bfl.ai"]
  TAVILY_API_KEY:
    domains: ["api.tavily.com"]
  TRAVERSAAL_API_KEY:
    domains: ["api-ares.traversaal.ai"]
  WOLFRAM_APP_ID:
    domains: ["www.wolframalpha.com"]
  OPENWEATHER_API_KEY:
    domains: ["api.openweathermap.org"]
  SERPAPI_API_KEY:
    domains: ["serpapi.com"]
  DISCORD_CLIENT_ID:
    domains: ["discord.com", "cdn.discordapp.com"]
  GOOGLE_CLIENT_ID:
    domains: ["accounts.google.com"]
  GITHUB_CLIENT_ID:
    domains: ["github.com"]
  FACEBOOK_CLIENT_ID:
    domains: ["graph.facebook.com"]
  APPLE_CLIENT_ID:
    domains: ["appleid.apple.com"]
  OPENID_CLIENT_ID:
    domains: ["login.microsoftonline.com", "graph.microsoft.com"]

subprocess_mcp:
  uvx:
    domains: ["pypi.org", "files.pythonhosted.org"]
  npx:
    domains: ["registry.npmjs.org"]
