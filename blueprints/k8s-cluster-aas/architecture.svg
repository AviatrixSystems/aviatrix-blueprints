      <text x="450" y="405" text-anchor="middle" fill="#92400E" font-size="13" font-weight="700">DCF Policy — Inter-Cluster Rules (VPC SmartGroups)</text>
      <text x="150" y="430" fill="#4A5568" font-size="11">PERMIT  sg-team-a-vpc  &rarr;  sg-team-b-svc   TCP/443   (approved API)</text>
      <text x="150" y="450" fill="#4A5568" font-size="11">DENY    sg-team-a-vpc  &rarr;  sg-team-c-vpc   ANY       (block A&rarr;C)</text>
      <text x="150" y="470" fill="#4A5568" font-size="11">DENY    sg-team-c-vpc  &rarr;  sg-team-a-vpc   ANY       (block C&rarr;A)</text>
      <text x="150" y="490" fill="#059669" font-size="11" font-weight="600">Both directions explicitly denied &mdash; see Section 8 DCF best practices</text>
